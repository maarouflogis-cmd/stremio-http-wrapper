services:
  wrapper:
    build: .
    restart: unless-stopped
    ports:
      - "7000:7000"        # put a HTTPS reverse proxy (Caddy/nginx) in front of this
      - "6881:6881/tcp"
      - "6881:6881/udp"
    environment:
      PUBLIC_URL: "https://addon.example.com"   # your public HTTPS address
      PLAY_SECRET: "change-me-to-a-long-random-string"
      IDLE_TIMEOUT_MIN: "10"
      MAX_TORRENTS: "5"
    volumes:
      - cache:/cache
volumes:
  cache:
