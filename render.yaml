services:
  - type: web
    name: stremio-http-wrapper
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PLAY_SECRET
        generateValue: true
      - key: MAX_TORRENTS
        value: "3"
